	<head>

	<body>

		<div id="root"></div>

					"three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",

				}
			}
		</script>
		<script type="module">
			// Preload TalkingHead module so it's available globally
			import { TalkingHead } from 'talkinghead';
			window.TalkingHeadClass = TalkingHead;
			window.TalkingHeadModule = { TalkingHead };
			console.log('TalkingHead module loaded');
		</script>
