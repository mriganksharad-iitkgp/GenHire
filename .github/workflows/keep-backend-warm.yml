name: Keep backend warm

# Cloud Run scales the GenHire backend to zero after a period of no traffic,
# so the next real request pays a cold-start penalty (container boot + Python
# imports + Mongo reconnect). This pings the health endpoint on a schedule to
# keep an instance warm most of the time.
#
# This is a best-effort mitigation, not a guarantee: Google does not promise
# that traffic alone prevents scale-to-zero (Cloud Run can still recycle an
# idle instance), and GitHub's cron scheduler is not perfectly punctual under
# load. For a guaranteed fix, set `--min-instances=1` on the Cloud Run
# service instead (see docs/backend/backend-detailed.md) — that costs
# continuous compute rather than GitHub Actions minutes.
#
# NOTE: GitHub disables scheduled workflows after 60 days with no repo
# activity (commits/pushes) on the default branch — a routine push
# re-enables it. NOTE: on a private repo this workflow's ~5-minute cadence
# uses a meaningful share of the free Actions-minutes quota (~1400 min/month
# at ~10s/run); widen the cron interval below if that becomes a problem, or
# it's unlimited on a public repo.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -sf --max-time 60 --retry 2 --retry-delay 5 \
            "https://hrtech-628047232128.europe-west1.run.app/health"
